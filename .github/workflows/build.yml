name: Build DD EXE (Nativefier Chromium)
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install nativefier
        run: npm install -g nativefier

      - name: Build from online url
        run: |
          nativefier "https://naitunai.github.io/DD/" `
            --name "咚咚" `
            --platform windows `
            --out ./build_output `
            --disable-context-menu

      - name: Show generated files
        run: Get-ChildItem ./build_output -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DD-Windows-package
          path: ./build_output/**
